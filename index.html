<h1>DeskMemo</h1>
<p class="sub">윈도우 바탕화면 메모 위젯 (개인용)</p>
<p>DeskMemo는 바탕화면에 띄워 두고 쓰는 날짜별 메모 프로그램입니다. 메모는 사용자의 PC에 저장되며, 사용자가 허용한 경우 메모 내용을 사용자 본인의 Google 캘린더에 일정으로 등록합니다.</p>
<ul>
<li>날짜별 메모 작성·자동 저장</li>
<li>메모 항목을 Google 캘린더 종일 일정으로 동기화</li>
<li>지정한 메일 제목을 메모에 자동 입력</li>
</ul>
